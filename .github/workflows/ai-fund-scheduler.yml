name: Autonomous AI Fund Scheduler

on:
  schedule:
    # Runs every 15 minutes UTC (Continuous cloud monitoring)
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-fund-scheduler
  cancel-in-progress: false

jobs:
  run-ai-fund-step:
    name: Run AI Scanning & Trading Engine
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Run Cloud AI Autopilot Trading Step
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TOSS_CLIENT_ID: ${{ secrets.TOSS_CLIENT_ID }}
          TOSS_CLIENT_SECRET: ${{ secrets.TOSS_CLIENT_SECRET }}
          TOSS_ACCOUNT_NO: ${{ secrets.TOSS_ACCOUNT_NO }}
        run: |
          npx tsx scripts/run-cloud-cron.ts

      - name: Persist Updated Trading State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f server_fund_storage.json ]; then
            git add server_fund_storage.json
            if ! git diff-index --quiet HEAD --; then
              git commit -m "chore(data): sync ai trading state [skip ci]"
              git push
            else
              echo "No state changes to commit."
            fi
          fi
